name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - run: bun install --frozen-lockfile
      - name: Install NativeScript CLI
        run: bun install -g nativescript

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          bun run build:release -- \
            --key-store-path "$RUNNER_TEMP/release.keystore" \
            --key-store-password "$KEYSTORE_PASSWORD" \
            --key-store-alias "$KEY_ALIAS" \
            --key-store-alias-password "$KEY_PASSWORD"

      - name: Rename APK to mblem-<tag>.apk
        run: cp platforms/android/app/build/outputs/apk/release/app-release.apk "mblem-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "mblem-${GITHUB_REF_NAME}.apk" --title "$GITHUB_REF_NAME" --generate-notes
